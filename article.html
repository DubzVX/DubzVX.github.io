<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ThreatHunter // Article</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="blog.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;500;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet" />
  <!-- Marked.js for Markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- highlight.js for code syntax highlighting -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/base16/tomorrow-night.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>
</head>
<body>

  <div class="scanlines" aria-hidden="true"></div>

  <!-- NAV -->
  <nav class="nav" role="navigation">
    <div class="nav-logo">
      <a href="index.html" style="text-decoration:none;color:inherit;">
        <span class="nav-bracket">[</span>
        <span class="nav-title">THREAT<span class="accent">HUNTER</span></span>
        <span class="nav-bracket">]</span>
      </a>
    </div>
    <ul class="nav-links">
      <li><a href="index.html#about">// À propos</a></li>
      <li><a href="index.html#projects">// Projets</a></li>
      <li><a href="index.html#skills">// Arsenal</a></li>
      <li><a href="blog.html" style="color:var(--green)">// Articles</a></li>
      <li><a href="index.html#contact">// Contact</a></li>
    </ul>
    <button class="nav-toggle" aria-label="Menu mobile" onclick="document.querySelector('.nav-links').classList.toggle('open')">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <!-- ARTICLE CONTAINER -->
  <main class="article-main">
    <div class="article-container">

      <!-- BACK LINK -->
      <a href="blog.html" class="article-back font-mono">← retour aux articles</a>

      <!-- ARTICLE HEADER (filled by JS) -->
      <header class="article-header" id="article-header">
        <div class="loading-state">
          <span class="font-mono" style="color:var(--text-muted)">$ fetching article...</span>
        </div>
      </header>

      <!-- TABLE OF CONTENTS -->
      <aside class="article-toc" id="article-toc" aria-label="Table des matières"></aside>

      <!-- ARTICLE BODY -->
      <article class="article-body" id="article-body"></article>

      <!-- FOOTER NAV -->
      <nav class="article-nav" id="article-nav" aria-label="Article précédent / suivant"></nav>

    </div>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <span class="footer-logo">THREAT<span class="accent">HUNTER</span></span>
      <span class="footer-copy">// Hébergé sur GitHub Pages</span>
      <span class="footer-status"><span class="status-dot"></span> ALL SYSTEMS OPERATIONAL</span>
    </div>
  </footer>

  <script src="article.js"></script>
</body>
</html>
