<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DubzVX // Articles</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="blog.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;500;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet" />
</head>
<body>

  <div class="scanlines" aria-hidden="true"></div>

  <nav class="nav" role="navigation" aria-label="Main navigation">
    <div class="nav-logo">
      <a href="index.html" style="text-decoration:none;color:inherit;">
        <span class="nav-bracket">[</span>
        <span class="nav-title">DUBZ<span class="accent">VX</span></span>
        <span class="nav-bracket">]</span>
      </a>
    </div>
    <ul class="nav-links">
      <li><a href="index.html#about">// About</a></li>
      <li><a href="blog.html" style="color:var(--green)">// Articles</a></li>
      <li><a href="index.html#contact">// Contact</a></li>
    </ul>
    <button class="nav-toggle" aria-label="Mobile menu" onclick="document.querySelector('.nav-links').classList.toggle('open')">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <header class="blog-header">
    <div class="blog-header-grid" aria-hidden="true"></div>
    <div class="container">
      <div class="blog-header-content">
        <div class="hero-status">
          <span class="status-dot"></span>
          <span class="status-text">INTEL FEED ACTIVE // LATEST POSTS</span>
        </div>
        <h1 class="blog-main-title">THREAT INTEL <span class="accent">BLOG</span></h1>
        <p class="blog-subtitle font-mono">Write-ups · Detection Rules · Malware Analysis</p>
      </div>
    </div>
  </header>

  <div class="blog-controls">
    <div class="container">
      <div class="blog-controls-inner">
        <div class="blog-search-wrap">
          <span class="search-icon">$</span>
          <input type="text" id="blog-search" placeholder="grep -i 'cobalt strike' articles/" class="blog-search" aria-label="Search articles" />
        </div>
        <div class="filter-bar" role="group" aria-label="Filter by category">
          <button class="filter-btn active" data-filter="all">ALL</button>
          <button class="filter-btn" data-filter="writeup">WRITE-UP</button>
          <button class="filter-btn" data-filter="detection">DETECTION</button>
          <button class="filter-btn" data-filter="malware">MALWARE</button>
        </div>
      </div>
    </div>
  </div>

  <main class="blog-main">
    <div class="container">
      <div id="articles-grid" class="articles-grid">
        <div class="loading-state" id="loading-state">
          <span class="font-mono" style="color:var(--text-muted)">$ loading articles...</span>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <span class="footer-logo">DUBZ<span class="accent">VX</span></span>
      <span class="footer-copy">// Built with ❤️ and coffee // Hosted on GitHub Pages</span>
      <span class="footer-status"><span class="status-dot"></span> ALL SYSTEMS OPERATIONAL</span>
    </div>
  </footer>

  <script src="blog.js"></script>
</body>
</html>
